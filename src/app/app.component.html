<main class="app-container">
  <header>
    <h1>🌦️ Meteo App</h1>
    <p>Inserisci latitudine e longitudine per conoscere il meteo attuale</p>
  </header>

  <app-weather-form (search)="onSearch($event)"></app-weather-form>

  @if (loading()) {
    <p class="loading">Caricamento dati meteo...</p>
  }

  @if (error()) {
    <p class="error-message">{{ error() }}</p>
  }

  @if (weatherData(); as data) {
    <app-weather-display [data]="data"></app-weather-display>
  }
</main>
